app = "hermes-telegram-bot"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  HERMES_HOME = "/app/.hermes"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

    [services.ports.tls_options]
      alpn = ["http/1.1"]

  [[services.tcp_checks]]
    grace_period = "1s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"
